name: PrizePicks Tracker

on:
  schedule:
    # Runs every hour at the 0 minute mark
    - cron: '0 * * * *'
  # Enables the "Run workflow" button in the GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # curl_cffi for proxy bypass, requests for scrape.do, discord-webhook for alerts
          pip install curl_cffi discord-webhook requests

      - name: Run Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: python main.py
